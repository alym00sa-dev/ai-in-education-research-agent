[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "open-deep-research-v2"
version = "0.1.0"
description = "Education-focused multi-iteration deep research pipeline"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-mcp-adapters>=0.1.0",
    "pydantic>=2.0",
    "tavily-python>=0.3.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "arxiv>=2.1.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
